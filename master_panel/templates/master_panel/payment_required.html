<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso suspenso — Aurora Elo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fff5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border-radius: 1rem; border: 1px solid #fecaca; padding: 2.5rem; max-width: 480px; width: 90%; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.35rem; color: #991b1b; margin: 0 0 .75rem; }
    p { color: #64748b; line-height: 1.6; margin: 0 0 1.25rem; }
    .reason { background: #fef2f2; border-left: 4px solid #dc2626; border-radius: .375rem; padding: .75rem 1rem; font-size: .875rem; color: #7f1d1d; text-align: left; margin-bottom: 1.5rem; }
    a.btn { display: inline-block; background: #7c3aed; color: #fff; text-decoration: none; padding: .6rem 1.5rem; border-radius: .5rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚫</div>
    <h1>Acesso suspenso</h1>
    <p>O acesso da clínica <strong>{{ clinic.name }}</strong> foi temporariamente suspenso por pendência de pagamento.</p>
    {% if subscription.block_reason %}
    <div class="reason"><strong>Motivo:</strong> {{ subscription.block_reason }}</div>
    {% endif %}
    <p style="font-size:.875rem;">Para regularizar, entre em contato com o suporte:</p>
    <a class="btn" href="mailto:{{ support_email }}">✉️ {{ support_email }}</a>
  </div>
</body>
</html>
