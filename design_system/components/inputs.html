<!-- Aurora Elo Design System - Inputs, Masks & Controls -->

<!-- 1. Text Input (Full Name) -->
<div class="space-y-1.5">
  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
    Nome Completo do Paciente <span class="text-crisis-500">*</span>
  </label>
  <div class="relative">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
    </div>
    <input type="text" placeholder="Ex: Mariana Silveira Fagundes" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-aurora-500/20 focus:border-aurora-500 transition-all text-slate-900 dark:text-white placeholder-slate-400" />
  </div>
  <p class="text-[11px] text-slate-500">Nome civil completo registrado no cartão de saúde.</p>
</div>

<!-- 2. Masked CPF Input -->
<div class="space-y-1.5">
  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
    CPF / Documento Fiscal <span class="text-crisis-500">*</span>
  </label>
  <div class="relative">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path></svg>
    </div>
    <input type="text" data-mask="cpf" maxlength="14" placeholder="000.000.000-00" class="w-full pl-10 pr-4 py-2.5 font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-aurora-500/20 focus:border-aurora-500 transition-all text-slate-900 dark:text-white placeholder-slate-400" />
  </div>
</div>

<!-- 3. Masked Phone / WhatsApp Input -->
<div class="space-y-1.5">
  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
    Telefone / WhatsApp para Teleconsulta
  </label>
  <div class="relative">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
    </div>
    <input type="text" data-mask="phone" maxlength="15" placeholder="(11) 98765-4321" class="w-full pl-10 pr-4 py-2.5 font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-aurora-500/20 focus:border-aurora-500 transition-all text-slate-900 dark:text-white placeholder-slate-400" />
  </div>
</div>

<!-- 4. Masked Date of Birth -->
<div class="space-y-1.5">
  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
    Data de Nascimento
  </label>
  <div class="relative">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
    </div>
    <input type="text" data-mask="date" maxlength="10" placeholder="DD/MM/AAAA" class="w-full pl-10 pr-4 py-2.5 font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-aurora-500/20 focus:border-aurora-500 transition-all text-slate-900 dark:text-white placeholder-slate-400" />
  </div>
</div>

<!-- 5. Masked Time Input -->
<div class="space-y-1.5">
  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
    Horário do Atendimento
  </label>
  <div class="relative">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    </div>
    <input type="text" data-mask="time" maxlength="5" placeholder="14:30" class="w-full pl-10 pr-4 py-2.5 font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-aurora-500/20 focus:border-aurora-500 transition-all text-slate-900 dark:text-white placeholder-slate-400" />
  </div>
</div>

<!-- 6. Masked Currency Input -->
<div class="space-y-1.5">
  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
    Honorários da Sessão / Consulta
  </label>
  <div class="relative">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
      <span class="font-bold text-xs text-aurora-600">R$</span>
    </div>
    <input type="text" data-mask="currency" placeholder="R$ 450,00" class="w-full pl-10 pr-4 py-2.5 font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-aurora-500/20 focus:border-aurora-500 transition-all text-slate-900 dark:text-white placeholder-slate-400" />
  </div>
</div>

<!-- 7. Masked CEP / Postal Code Input -->
<div class="space-y-1.5">
  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
    CEP do Paciente
  </label>
  <div class="relative">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
    </div>
    <input type="text" data-mask="cep" maxlength="9" placeholder="01310-100" class="w-full pl-10 pr-4 py-2.5 font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-aurora-500/20 focus:border-aurora-500 transition-all text-slate-900 dark:text-white placeholder-slate-400" />
  </div>
</div>

<!-- 8. Password Input with Strength & Eye Toggle -->
<div class="space-y-1.5">
  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
    Senha de Acesso ao Portal
  </label>
  <div class="relative">
    <input type="password" placeholder="Digite sua senha segura" class="input-password-strength w-full pl-4 pr-11 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-aurora-500/20 focus:border-aurora-500 transition-all text-slate-900 dark:text-white placeholder-slate-400" />
    <button type="button" class="toggle-password-visibility absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
    </button>
  </div>
  <div class="space-y-1 mt-1">
    <div class="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
      <div class="password-strength-bar h-full w-0 transition-all duration-300"></div>
    </div>
    <div class="flex justify-between items-center">
      <span class="password-strength-label text-xs font-medium"></span>
      <span class="text-[10px] text-slate-400">Mínimo 8 caracteres, números e símbolos</span>
    </div>
  </div>
</div>

<!-- 9. Select Dropdown (CID-11 / Diagnostic category) -->
<div class="space-y-1.5">
  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
    Classificação Diagnóstica CID-11 / DSM-5
  </label>
  <div class="relative">
    <select class="w-full pl-4 pr-10 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-aurora-500/20 focus:border-aurora-500 transition-all text-slate-900 dark:text-white appearance-none cursor-pointer">
      <option value="">Selecione a categoria diagnóstica...</option>
      <option value="6A70">6A70 - Transtorno Depressivo Maior, Episódio Único</option>
      <option value="6A71">6A71 - Transtorno Depressivo Recorrente</option>
      <option value="6A60">6A60 - Transtorno Bipolar Tipo I</option>
      <option value="6B00">6B00 - Transtorno de Ansiedade Generalizada (TAG)</option>
      <option value="6B01">6B01 - Transtorno do Pânico</option>
      <option value="6B20">6B20 - Transtorno Obsessivo-Compulsivo (TOC)</option>
      <option value="6B40">6B40 - Transtorno de Estresse Pós-Traumático (TEPT)</option>
      <option value="6A20">6A20 - Esquizofrenia</option>
      <option value="6A02">6A02 - Transtorno do Espectro Autista (TEA)</option>
      <option value="6A05">6A05 - TDAH (Déficit de Atenção / Hiperatividade)</option>
    </select>
    <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
    </div>
  </div>
</div>

<!-- 10. Textarea with live character counter -->
<div class="space-y-1.5">
  <div class="flex justify-between items-center">
    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
      Histórico Clínico & Evolução Psiquiátrica
    </label>
    <span id="notes-char-counter" class="text-xs text-slate-400 font-mono">0 / 1000</span>
  </div>
  <textarea id="clinical-notes-textarea" rows="4" maxlength="1000" placeholder="Descreva a queixa principal, evolução dos sintomas, histórico farmacológico prévio, qualidade do sono, fatores de estresse e suporte familiar..." class="w-full p-3.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-aurora-500/20 focus:border-aurora-500 transition-all text-slate-900 dark:text-white placeholder-slate-400"></textarea>
</div>

<!-- 11. Range Slider (Anxiety / Pain Analog Scale) -->
<div class="space-y-2 p-4 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800">
  <div class="flex justify-between items-center">
    <label class="text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
      Escala de Ansiedade / Sofrimento Psíquico (0 a 10)
    </label>
    <div id="anxiety-scale-val"></div>
  </div>
  <input id="anxiety-scale-slider" type="range" min="0" max="10" value="4" class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer" />
  <div class="flex justify-between text-[11px] text-slate-400 font-medium">
    <span>0 (Eutímico / Sem Sofrimento)</span>
    <span>5 (Ansiedade Moderada)</span>
    <span>10 (Pânico / Crise Aguda)</span>
  </div>
</div>

<!-- 12. 6-Digit OTP / 2FA Verification Inputs -->
<div class="space-y-2">
  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
    Código de Verificação 2FA (6 Dígitos)
  </label>
  <div class="otp-inputs-group flex gap-2 sm:gap-3 justify-between max-w-sm">
    <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-aurora-500 focus:ring-2 focus:ring-aurora-500/20 outline-none" />
    <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-aurora-500 focus:ring-2 focus:ring-aurora-500/20 outline-none" />
    <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-aurora-500 focus:ring-2 focus:ring-aurora-500/20 outline-none" />
    <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-aurora-500 focus:ring-2 focus:ring-aurora-500/20 outline-none" />
    <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-aurora-500 focus:ring-2 focus:ring-aurora-500/20 outline-none" />
    <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold font-mono bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-aurora-500 focus:ring-2 focus:ring-aurora-500/20 outline-none" />
  </div>
</div>
