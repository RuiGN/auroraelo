# Disposable local test services. No persistent data or production credentials.
name: auroraelo-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auroraelo
      POSTGRES_USER: auroraelo
      POSTGRES_PASSWORD: auroraelo-test-only
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auroraelo -d auroraelo"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56389:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
