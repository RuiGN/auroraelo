<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Elo Clínica - App Mobile Conectado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            aurora: {
              50: '#f0f7ff', 100: '#e0f0fe', 200: '#bae0fd', 300: '#7cc7fb', 400: '#38a9f8',
              500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0a2540', 950: '#051424'
            },
            elo: {
              50: '#ecfeff', 100: '#cffafe', 200: '#a5f3fc', 300: '#67e8f9', 400: '#22d3ee',
              500: '#06b6d4', 600: '#0891b2', 700: '#0e7490', 800: '#155e75', 900: '#164e63'
            },
            crisis: { 500: '#f43f5e', 600: '#e11d48' },
            healing: { 50: '#f0fdf4', 500: '#10b981', 600: '#059669' }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="bg-slate-100 dark:bg-slate-950 flex items-center justify-center min-h-screen p-4 font-sans">
  <!-- Mobile Device Simulation Frame -->
  <div class="mobile-device-frame">
    <!-- Notch / Dynamic Island -->
    <div class="mobile-notch">
      <div class="mobile-camera"></div>
      <div class="mobile-speaker"></div>
    </div>

    <!-- Mobile Screen Scrollable Content -->
    <div class="mobile-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col justify-between">
      <!-- Status & Top Header -->
      <div class="px-5 pt-3 pb-4">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center space-x-2">
            <img src="assets/images/logo.png" alt="Logo" class="h-6 w-auto" />
            <span class="font-display font-extrabold text-sm text-aurora-950 dark:text-white">Aurora <span class="text-elo-500">Elo</span></span>
          </div>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-healing-50 text-healing-700 border border-healing-200 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-healing-500"></span> Conectado
          </span>
        </div>

        <!-- Patient Greeting -->
        <div class="flex items-center justify-between mt-2">
          <div>
            <h2 class="text-lg font-extrabold text-slate-900 dark:text-white font-display" data-i18n="m1_welcome">Olá, Mariana</h2>
            <p class="text-xs text-slate-500" data-i18n="m1_status">Seu plano terapêutico está em dia</p>
          </div>
          <img src="assets/images/patient-1.jpg" alt="Mariana" class="w-10 h-10 rounded-xl object-cover ring-2 ring-aurora-500/30" />
        </div>
      </div>

      <!-- App Main Content Sections -->
      <div class="px-5 space-y-4 flex-1">
        <!-- Telehealth Card (Priority Action) -->
        <div class="p-4 rounded-2xl bg-gradient-to-br from-aurora-900 to-aurora-950 text-white shadow-aurora relative overflow-hidden">
          <div class="flex items-center justify-between text-[11px] text-elo-300 font-bold mb-2">
            <span class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-healing-400 live-indicator"></span>
              <span data-i18n="m1_quick_tele">Teleconsulta Hoje, 14:30</span>
            </span>
            <span class="bg-white/10 px-2 py-0.5 rounded font-mono text-[10px]">12 min</span>
          </div>
          <div class="flex items-center space-x-3 mb-3">
            <img src="assets/images/doctor-male.jpg" alt="Doctor" class="w-9 h-9 rounded-xl object-cover ring-1 ring-white/30" />
            <div>
              <h4 class="text-xs font-bold text-white" data-i18n="m1_doctor">Dr. Marcelo Arantes • Psiquiatra</h4>
              <p class="text-[10px] text-aurora-200">Reavaliação e ajuste de medicação</p>
            </div>
          </div>
          <button class="w-full py-2.5 rounded-xl font-bold text-xs bg-elo-500 hover:bg-elo-400 text-aurora-950 shadow-aurora-glow transition-all flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            <span data-i18n="m1_join_call">Acessar Teleconsulta</span>
          </button>
        </div>

        <!-- Medications Adherence Checklist -->
        <div class="p-4 rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 shadow-sm">
          <div class="flex items-center justify-between mb-2.5">
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300" data-i18n="m1_meds_title">Medicamentos de Hoje</h4>
            <span class="text-[11px] font-bold text-healing-600 bg-healing-50 px-2 py-0.5 rounded-full">1/2 Tomados</span>
          </div>
          <div class="space-y-2">
            <label class="flex items-center justify-between p-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-700 cursor-pointer">
              <div class="flex items-center space-x-2.5">
                <input type="checkbox" checked class="custom-checkbox w-4 h-4 rounded text-aurora-600" />
                <span class="text-xs font-medium text-slate-700 dark:text-slate-200 line-through opacity-70" data-i18n="m1_med_1">Escitalopram 15mg • 08:00 (Tomado ✓)</span>
              </div>
            </label>
            <label class="flex items-center justify-between p-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-700 cursor-pointer">
              <div class="flex items-center space-x-2.5">
                <input type="checkbox" class="custom-checkbox w-4 h-4 rounded text-aurora-600" />
                <span class="text-xs font-semibold text-slate-800 dark:text-white" data-i18n="m1_med_2">Quetiapina 25mg • 21:00 (Pendente)</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Quick Emergency SOS Button -->
        <a href="tel:0800770356" class="w-full py-3 px-4 rounded-2xl bg-crisis-500 hover:bg-crisis-600 text-white font-bold text-xs flex items-center justify-between shadow-crisis-glow transition-all crisis-pulse">
          <div class="flex items-center space-x-2.5">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <span data-i18n="m1_sos_btn">Botão de Ajuda Imediata / SOS</span>
          </div>
          <span class="text-[10px] bg-crisis-700 px-2 py-0.5 rounded-full font-mono">24h</span>
        </a>

        <!-- Clinical Chat Direct Access -->
        <div class="p-3.5 rounded-2xl bg-aurora-50 dark:bg-aurora-950/60 border border-aurora-100 dark:border-aurora-900 flex items-center justify-between">
          <div class="flex items-center space-x-2.5">
            <svg class="w-5 h-5 text-aurora-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            <span class="text-xs font-semibold text-aurora-900 dark:text-aurora-200" data-i18n="m1_chat_doc">Mensagem com Equipe Clínica</span>
          </div>
          <span class="w-2 h-2 rounded-full bg-elo-500"></span>
        </div>
      </div>

      <!-- Mobile Bottom Navigation Bar -->
      <div class="mt-4 pt-2 border-t border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 px-6 py-2 flex items-center justify-between text-[10px] font-medium text-slate-500 dark:text-slate-400">
        <div class="flex flex-col items-center text-aurora-600 dark:text-elo-400">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
          <span>Início</span>
        </div>
        <div class="flex flex-col items-center hover:text-aurora-600">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span>Agenda</span>
        </div>
        <div class="flex flex-col items-center hover:text-aurora-600">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
          <span>Remédios</span>
        </div>
        <div class="flex flex-col items-center hover:text-aurora-600">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          <span>Perfil</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script>
    if (window.AuroraI18n) window.AuroraI18n.init();
  </script>
</body>
</html>
