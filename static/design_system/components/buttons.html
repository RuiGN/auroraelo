<!-- Aurora Elo Design System - Button Components -->
<!-- 1. Primary Aurora Button -->
<button class="px-5 py-2.5 rounded-xl font-medium text-white bg-gradient-to-r from-aurora-900 via-aurora-700 to-aurora-600 hover:from-aurora-950 hover:to-aurora-700 shadow-aurora hover:shadow-aurora-lg transition-all duration-200 flex items-center gap-2 focus:ring-4 focus:ring-aurora-500/20 active:scale-95">
  <svg class="w-5 h-5 text-elo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
  <span>Novo Agendamento</span>
</button>

<!-- 2. Elo Cyan Glow Button -->
<button class="px-5 py-2.5 rounded-xl font-medium text-white bg-gradient-to-r from-aurora-600 to-elo-500 hover:from-aurora-700 hover:to-elo-600 shadow-aurora-glow hover:shadow-lg transition-all duration-200 flex items-center gap-2 focus:ring-4 focus:ring-elo-400/25 active:scale-95">
  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
  <span>Iniciar Telepsiquiatria</span>
</button>

<!-- 3. Crisis / Emergency SOS Button (Pulsing) -->
<button class="crisis-pulse px-5 py-2.5 rounded-xl font-semibold text-white bg-gradient-to-r from-crisis-600 to-crisis-500 hover:from-crisis-700 hover:to-crisis-600 shadow-crisis-glow transition-all duration-200 flex items-center gap-2 focus:ring-4 focus:ring-crisis-500/30">
  <span class="w-2.5 h-2.5 rounded-full bg-white animate-ping"></span>
  <span>SOS Crise Psiquiátrica 24h</span>
</button>

<!-- 4. Secondary / Outline Button -->
<button class="px-5 py-2.5 rounded-xl font-medium text-aurora-800 dark:text-aurora-200 bg-white dark:bg-aurora-900/60 border border-slate-200 dark:border-aurora-800 hover:bg-slate-50 dark:hover:bg-aurora-800/50 hover:border-aurora-300 transition-all duration-200 flex items-center gap-2 shadow-sm">
  <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
  <span>Exportar Relatório Clínico</span>
</button>

<!-- 5. Healing / Stability Button -->
<button class="px-4 py-2 rounded-xl font-medium text-healing-700 bg-healing-50 border border-healing-200 hover:bg-healing-100 transition-colors flex items-center gap-2 text-sm">
  <span class="w-2 h-2 rounded-full bg-healing-500"></span>
  <span>Confirmar Alta Médica</span>
</button>
