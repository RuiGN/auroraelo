<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aurora Elo">
  <title>Aurora Elo</title>
  <defs>
    <linearGradient id="auroraGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E5A96;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D3B5C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="auroraGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A8A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008080;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Vetor Aurora Elo existente em static/images/favicon.svg. -->
  <rect width="200" height="200" fill="#FFFFFF"/>
  <g transform="translate(100, 100)" filter="url(#glow)">
    <path d="M -30 0 Q -40 -20 -30 -40 Q -10 -50 10 -40 L 5 0 Q -10 -15 -30 0"
          fill="url(#auroraGradient1)" opacity="0.9"/>
    <path d="M 30 0 Q 40 -20 30 -40 Q 10 -50 -10 -40 L -5 0 Q 10 -15 30 0"
          fill="url(#auroraGradient2)" opacity="0.8"/>
    <circle cx="0" cy="-25" r="8" fill="#2A7F7F" opacity="0.7"/>
    <path d="M -15 15 Q -25 25 -15 40 Q 0 45 15 35"
          fill="url(#auroraGradient1)" opacity="0.8"/>
    <path d="M 15 15 Q 25 25 15 40 Q 0 45 -15 35"
          fill="url(#auroraGradient2)" opacity="0.75"/>
  </g>
</svg>
