{% extends "accounts/auth_base.html" %}
{% load i18n %}

{% block auth_content %}
<section aria-labelledby="auth-message-title">
  <div class="text-center">
    <span class="aurora-auth-icon" aria-hidden="true"><i class="feather-info w-8 h-8"></i></span>
    <h1 id="auth-message-title">{{ title }}</h1>
    <p class="aurora-auth-subtitle mb-3" role="status">{{ message }}</p>
    <a class="btn btn-primary" href="{{ action_url }}">{{ action_label }}</a>
  </div>
</section>
{% endblock %}
