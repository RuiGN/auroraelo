<div class="col-12 col-md-6 col-xxl-4">
  <a class="card stretch stretch-full product-shortcut h-100 mb-0" href="{% url route %}">
    <div class="card-body d-flex align-items-start gap-3">
      <span class="avatar-text avatar-lg rounded bg-soft-primary text-primary flex-shrink-0"><i class="{{ icon }}" aria-hidden="true"></i></span>
      <div class="flex-grow-1">
        <h3 class="fs-16 fw-semibold mb-2">{{ label }}</h3>
        <p class="fs-13 text-body-secondary mb-0">{{ description }}</p>
      </div>
      <i class="feather-arrow-up-right text-body-secondary" aria-hidden="true"></i>
    </div>
  </a>
</div>
