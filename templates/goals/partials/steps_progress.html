{% load i18n %}
{# HTMX partial: goal steps list with inline toggle — swapped into #goal-steps #}
<div id="goal-steps">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div class="progress flex-grow-1 me-3" style="height: 8px;" role="progressbar"
         aria-valuenow="{{ percent }}" aria-valuemin="0" aria-valuemax="100"
         aria-label="{% translate 'Progresso da meta' %}">
      <div class="progress-bar" style="width: {{ percent }}%"></div>
    </div>
    <span class="text-muted small">{{ done_count }}/{{ total_steps }}</span>
  </div>

  <ul class="list-group list-group-flush border-top">
    {% for step in steps %}
      <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-2">
        <span class="{% if step.is_done %}text-decoration-line-through text-muted{% endif %}">
          {{ step.order }}. {{ step.description }}
        </span>
        <form method="post" action="{% url 'goal_step_toggle' step.pk %}"
              hx-post="{% url 'goal_step_toggle' step.pk %}"
              hx-target="#goal-steps"
              hx-swap="outerHTML">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.path }}">
          <input type="hidden" name="is_done" value="{% if step.is_done %}false{% else %}true{% endif %}">
          <button type="submit" class="btn btn-sm {% if step.is_done %}btn-outline-secondary{% else %}btn-outline-success{% endif %}">
            {% if step.is_done %}{% translate "Reabrir etapa" %}{% else %}{% translate "Concluir etapa" %}{% endif %}
          </button>
        </form>
      </li>
    {% endfor %}
  </ul>
</div>
