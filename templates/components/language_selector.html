{% load i18n %}
{% if ui_languages %}
<form method="post" action="{% url 'account_set_language' %}" class="aurora-lang-select m-0" data-language-form data-language-source="{{ selector_id }}" data-language-confirm="{% translate 'Há alterações não salvas. Alterar o idioma e descartar essas alterações?' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ ui_language_next }}">
  <span class="field-control-icon" aria-hidden="true"><i class="feather-globe"></i></span>
  <label class="visually-hidden" for="{{ selector_id }}-language-select">{% translate 'Idioma' %}</label>
  <select id="{{ selector_id }}-language-select" name="language" lang="{{ current_ui_language }}">
    {% for language in ui_languages %}
    <option value="{{ language.code }}"{% if language.code == current_ui_language %} selected{% endif %}>{{ language.name_local }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit" class="btn btn-sm btn-outline-primary ms-1">{% translate "Aplicar idioma" %}</button></noscript>
</form>
{% endif %}
