{% load i18n %}
{# Django messages framework — accessible translated live region. #}
{% if messages %}
<div class="d-grid gap-2" role="region" aria-label="{% translate 'Mensagens do sistema' %}">
  {% for message in messages %}
  <p class="alert alert-{% if message.level_tag == 'error' %}danger{% elif message.level_tag == 'warning' %}warning{% elif message.level_tag == 'success' %}success{% else %}info{% endif %} mb-0"{% if message.level_tag == 'error' %} role="alert"{% else %} role="status" aria-live="polite"{% endif %}>{{ message }}</p>
  {% endfor %}
</div>
{% endif %}
