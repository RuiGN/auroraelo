name: Aurora Elo quality

on:
  pull_request:
  push:
    branches: [main, hermes]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: auroraelo_test
          POSTGRES_USER: auroraelo_test
          POSTGRES_PASSWORD: ci-only-disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auroraelo_test -d auroraelo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE: postgresql
      DB_NAME: auroraelo_test
      DB_USER: auroraelo_test
      DB_PASSWORD: ci-only-disposable
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gettext
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Regulatory completeness (not clinical release approval)
        run: python scripts/check_regulatory_matrix.py
      - name: Lint and types
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
      - name: Django and migration checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Translation catalogs
        run: |
          python manage.py compilemessages
          python scripts/check_ui_catalogs.py --scope docs/migration/translated-ui-scope.json --output ui-catalog-check.json --pot-output ui.pot
          python scripts/check_djangojs_catalogs.py --output djangojs-catalog-check.json
      - name: PostgreSQL test suite
        run: python -m pytest --junitxml=test-results.xml
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-quality-evidence
          path: |
            test-results.xml
            ui-catalog-check.json
            djangojs-catalog-check.json
          if-no-files-found: ignore
